
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizBurst</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17152d;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:20px;background:#7438d8;font-size:27px;font-weight:900}
main{max-width:900px;margin:auto;padding:14px}
.panel{background:#272443;border-radius:18px;padding:20px;margin:14px 0}
button,input{font:inherit;border:0;border-radius:10px;padding:12px;margin:5px;max-width:100%}
button{background:#7438d8;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45}
input{width:90%;color:#17152d}
.hidden{display:none!important}
#status{padding:10px;color:#ffe17a;overflow-wrap:anywhere}
#catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.quiz{background:#393451;padding:14px;border-radius:12px}
.quiz button{width:100%}
.bigpin{font-size:40px;letter-spacing:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{width:100%;min-height:68px;margin:0;background:#e44d80}
.answer:nth-child(4n+2){background:#247ad9}
.answer:nth-child(4n+3){background:#d89b21}
.answer:nth-child(4n+4){background:#159b76}
.poker{background:white;color:#222;min-height:100px}
#timer{font-size:28px;padding:10px}
#feedback{min-height:30px}
#leaderboard{list-style:none;padding:0}
#leaderboard li{display:flex;justify-content:space-between;gap:8px;padding:13px;margin:7px 0;background:#393451;border-radius:10px;text-align:left}
#leaderboard li:first-child{background:#806427}
.muted{color:#c9c4e9;font-size:14px}
@media(max-width:480px){.panel{padding:13px}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>⚡ QuizBurst</header>
<div id="status">Ready</div>
<main>
<section id="home" class="panel">
<h1>QuizBurst Multiplayer</h1>
<p>Choose a quiz, invite your friends and climb the leaderboard!</p>
<button onclick="show('host')">🎮 Host a quiz</button>
<button onclick="show('join')">🚀 Join with PIN</button>
</section>

<section id="host" class="panel hidden">
<h2>Choose your quiz</h2>
<input id="hostName" placeholder="Host nickname">
<div id="catalog"></div>
<button onclick="show('home')">Back</button>
</section>

<section id="join" class="panel hidden">
<h2>Join a game</h2>
<input id="playerName" placeholder="Nickname">
<input id="pinInput" placeholder="Six-digit PIN" maxlength="6" inputmode="numeric">
<button onclick="joinRoom()">Join game</button>
<button onclick="show('home')">Back</button>
</section>

<section id="lobby" class="panel hidden">
<h2 id="quizTitle">Lobby</h2>
<p>Share this PIN with your players</p>
<div id="pin" class="bigpin"></div>
<p id="lobbyInfo">Waiting for players...</p>
<ul id="players"></ul>
<div id="hostStart"><button onclick="startGame()">▶ Start quiz</button></div>
</section>

<section id="game" class="panel hidden">
<div id="round"></div>
<h2 id="question"></h2>
<div id="timer"></div>
<div id="answers"></div>
<div id="feedback"></div>
<div id="hostControls" class="hidden">
<hr>
<button onclick="skipQuestion()">⏭ Skip question</button>
<button onclick="nextQuestion()">Next question ➜</button>
<button onclick="endGame()">End quiz</button>
</div>
</section>

<section id="results" class="panel hidden">
<h1>🏆 Final leaderboard</h1>
<h2 id="winner"></h2>
<ol id="leaderboard"></ol>
<button onclick="location.reload()">New game</button>
</section>
</main>

function show(id){document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));$(id).classList.remove("hidden")}
function status(t){$("status").textContent=t}
function send(c,m){if(c&&c.open)c.send(m)}
function broadcast(m){Object.values(connections).forEach(c=>send(c,m))}
function makeBoard(){return Object.values(players).map(p=>({id:p.id,name:p.name,score:scores[p.id]||0,streak:streaks[p.id]||0})).sort((a,b)=>b.score-a.score)}
function renderCatalog(){
 const root=$("catalog");root.innerHTML="";
 ["Maths","English","Random"].forEach(category=>{
  const h=document.createElement("h2");h.textContent=category;root.appendChild(h);
  h.style.gridColumn="1/-1";
  quizzes.filter(q=>q.category===category).forEach(q=>{
   const card=document.createElement("div");card.className="quiz";
   const title=document.createElement("h3");title.textContent=q.name;
   const desc=document.createElement("p");desc.className="muted";desc.textContent="10 questions";
   const btn=document.createElement("button");btn.textContent="Host this quiz";btn.onclick=()=>createRoom(q.id);
   card.append(title,desc,btn);root.appendChild(card);
  });
 });
}
function createRoom(id){

 peer.on("open",()=>{
  players={};scores={};streaks={};connections={};current=-1;gameStarted=false;

  $("lobbyInfo").textContent="10 questions ready. Share the PIN!";

 peer.on("connection",c=>{
  c.on("open",()=>{
   if(gameStarted){send(c,{type:"error",message:"This quiz has already started."});c.close();return}
   connections[c.peer]=c;
   c.on("data",m=>hostMessage(c.peer,m));
   c.on("close",()=>{delete connections[c.peer];delete players[c.peer];delete scores[c.peer];delete streaks[c.peer];updateLobby();broadcast({type:"roster",players:Object.values(players)})});
  });
 });
 peer.on("error",e=>status("PeerJS error: "+e.type+". Try again with a new room."));
}
function joinRoom(){
 if(!window.Peer){status("PeerJS could not load.");return}
 myName=$("playerName").value.trim()||"Player";pin=$("pinInput").value.trim();
 if(!/^\d{6}$/.test(pin)){alert("Enter the six-digit PIN.");return}
 status("Connecting to host...");
 peer=new Peer();
 peer.on("open",()=>{
  hostConn=peer.connect("quizburst-"+pin,{reliable:true});
  hostConn.on("open",()=>send(hostConn,{type:"join",name:myName}));
  hostConn.on("data",playerMessage);
  hostConn.on("error",()=>status("Connection error. Check the PIN."));
  hostConn.on("close",()=>status("Connection to host closed."));
 });
 peer.on("error",e=>status("Could not connect: "+e.type));
}
function hostMessage(id,m){
 if(!m||typeof m!=="object")return;
 if(m.type==="join"&&!gameStarted){
  players[id]={id,name:String(m.name||"Player").slice(0,24)};scores[id]=0;streaks[id]=0;
  send(connections[id],{type:"roster",players:Object.values(players)});
  updateLobby();broadcast({type:"roster",players:Object.values(players)});
 }
 if(m.type==="answer"&&gameStarted&&!roundDone&&m.round===current&&!Object.hasOwn(answers,id)){
  const q=selected.questions[current],correct=Number(m.value)===q.correct;
  answers[id]={correct};
  if(correct){streaks[id]=(streaks[id]||0)+1;scores[id]=(scores[id]||0)+Math.max(100,500+remaining*25)+(streaks[id]>=3?100:0)}
  else streaks[id]=0;
  send(connections[id],{type:"result",correct,score:scores[id]});
  updateAnswerCount();updateBoard();broadcast({type:"board",board:makeBoard()});
  if(Object.keys(answers).length>=Object.keys(players).length)finishRound();
 }
}
function updateLobby(){
 $("players").innerHTML="";
 Object.values(players).forEach(p=>{const li=document.createElement("li");li.textContent="🟢 "+p.name;$("players").appendChild(li)});
 $("lobbyInfo").textContent=Object.keys(players).length+" player(s) connected";
}
function startGame(){if(!isHost||!selected)return;gameStarted=true;current=-1;nextQuestion()}
function nextQuestion(){
 if(!isHost)return;
 clearInterval(timer);
 if(current>=0&&!roundDone&&!confirm("Move on before everyone has answered?"))return;
 current++;
 if(current>=selected.questions.length){endGame();return}
 answers={};roundDone=false;remaining=selected.questions[current].seconds;
 $("round").textContent="Question "+(current+1)+" / "+selected.questions.length;
 $("feedback").textContent="";$("hostControls").classList.remove("hidden");
 $("hostControls").querySelectorAll("button").forEach(b=>b.disabled=false);
 show("game");renderQuestion(selected.questions[current],true);
 broadcast({type:"question",index:current,total:selected.questions.length,q:selected.questions[current]});
 updateAnswerCount();timer=setInterval(tick,1000);
}
function renderQuestion(q,host){
 $("question").textContent=q.question;$("timer").textContent=remaining+" seconds";$("answers").innerHTML="";
 const grid=document.createElement("div");grid.className="grid";
 q.options.forEach((opt,i)=>{
  const b=document.createElement("button");b.className="answer";
  b.textContent=["🔺 ","🔷 ","🟡 ","🟢 "][i]+opt;
  b.onclick=()=>submit(i);grid.appendChild(b);
 });
 $("answers").appendChild(grid);
 if(host){$("answers").querySelectorAll("button").forEach(b=>b.disabled=true);$("feedback").textContent="Host controls the game. Players answer on their devices."}
 else $("feedback").textContent="Choose your answer!";
}
let submitted=false;
function submit(index){
 if(isHost||submitted||roundDone)return;
 submitted=true;$("answers").querySelectorAll("button").forEach(b=>b.disabled=true);
 send(hostConn,{type:"answer",round:current,value:index});
 $("feedback").textContent="Answer locked in!";
}
function tick(){
 if(roundDone)return;
 remaining--; $("timer").textContent=remaining+" seconds";broadcast({type:"tick",remaining});
 if(remaining<=0)finishRound();
}
function updateAnswerCount(){$("round").textContent="Question "+(current+1)+" / "+selected.questions.length+" • Answered "+Object.keys(answers).length+"/"+Object.keys(players).length}
function finishRound(){
 if(!isHost||roundDone)return;
 roundDone=true;clearInterval(timer);
 const q=selected.questions[current],count=Object.values(answers).filter(a=>a.correct).length;
 const correct=q.options[q.correct];
 $("answers").querySelectorAll("button").forEach(b=>b.disabled=true);
 $("feedback").textContent="Correct answer: "+correct+" • "+count+" correct";
 broadcast({type:"roundEnd",correct,count,board:makeBoard()});updateBoard();
}
function skipQuestion(){
 if(!isHost)return;
 clearInterval(timer);roundDone=true;
 broadcast({type:"roundEnd",correct:"Question skipped",count:0,board:makeBoard()});
 nextQuestion();
}
function updateBoard(){
 const b=makeBoard();$("leaderboard").innerHTML="";
 b.forEach((p,i)=>{
  const li=document.createElement("li"),left=document.createElement("span"),right=document.createElement("span");
  left.textContent=(["🥇","🥈","🥉"][i]||"#"+(i+1))+" "+p.name;
  right.textContent=p.score+" pts"+(p.streak>=3?" 🔥":"");
  li.append(left,right);$("leaderboard").appendChild(li);
 });
 $("winner").textContent=b.length?"Leading: "+b[0].name+" — "+b[0].score+" points":"No players joined.";
}
function endGame(){
 clearInterval(timer);if(isHost)broadcast({type:"gameOver",board:makeBoard()});
 show("results");updateBoard();status("Quiz finished!");
}
function playerMessage(m){
 if(!m||typeof m!=="object")return;
 if(m.type==="error"){alert(m.message);return}
 if(m.type==="roster"){
  $("players").innerHTML="";(m.players||[]).forEach(p=>{const li=document.createElement("li");li.textContent="🟢 "+p.name;$("players").appendChild(li)});
  $("lobbyInfo").textContent=(m.players||[]).length+" player(s) connected";
  $("quizTitle").textContent="Game lobby";$("hostStart").classList.add("hidden");$("pin").textContent=pin;show("lobby");return;
 }
 if(m.type==="question"){
  current=m.index;submitted=false;roundDone=false;remaining=m.q.seconds;
  $("round").textContent="Question "+(current+1)+" / "+m.total;
  $("hostControls").classList.add("hidden");renderQuestion(m.q,false);show("game");return;
 }
 if(m.type==="tick"){remaining=m.remaining;$("timer").textContent=remaining+" seconds";return}
 if(m.type==="result"){$("feedback").textContent=m.correct?"✅ Correct! "+m.score+" points":"❌ Not quite!";return}
 if(m.type==="board"){renderRemoteBoard(m.board);return}
 if(m.type==="roundEnd"){
  roundDone=true;$("answers").querySelectorAll("button").forEach(b=>b.disabled=true);
  $("feedback").textContent="Correct answer: "+m.correct+" • "+m.count+" correct";
  renderRemoteBoard(m.board);return;
 }
 if(m.type==="gameOver"){renderRemoteBoard(m.board);show("results");status("Quiz finished!")}
}
function renderRemoteBoard(board){
 $("leaderboard").innerHTML="";
 (board||[]).forEach((p,i)=>{const li=document.createElement("li");li.textContent=(i+1)+". "+p.name+" — "+p.score+" pts";$("leaderboard").appendChild(li)});
 $("winner").textContent=board&&board.length?"Leading: "+board[0].name+" — "+board[0].score+" points":"No players yet";
}
renderCatalog();
</script>
