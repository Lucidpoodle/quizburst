
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizBurst Multiplayer</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#17152d;color:white;text-align:center}
header{background:#7438d8;padding:18px;font-size:25px;font-weight:bold}
main{max-width:650px;margin:auto;padding:18px}
.card{background:#272443;border-radius:18px;padding:20px;margin:15px 0}
input,select,button{font-size:17px;padding:12px;border:0;border-radius:9px;margin:5px;max-width:100%}
input{width:90%;background:#fff;color:#222}
button{background:#7438d8;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.answer{display:block;width:100%;padding:16px;background:#e44d80}
.answer:nth-of-type(2){background:#247ad9}
.answer:nth-of-type(3){background:#d89b21}
.answer:nth-of-type(4){background:#159b76}
.small{color:#c9c4e9;font-size:14px}
#status{color:#ffe17a;overflow-wrap:anywhere}
.hidden{display:none}
li{margin:10px;text-align:left}
</style>
</head>
<body>
<header>⚡ QuizBurst</header>
<main>
<div id="status">Connecting tools…</div>

<section id="home" class="card">
<h2>Play or host</h2>
<button onclick="show('hostSetup')">🎮 Host a quiz</button>
<button onclick="show('joinSetup')">🚀 Join a quiz</button>
<p class="small">Multiplayer uses PeerJS. Everyone needs an internet connection.</p>
</section>

<section id="hostSetup" class="card hidden">
<h2>Host a quiz</h2>
<input id="hostName" placeholder="Your host name">
<button onclick="startHost()">Create lobby</button>
<button onclick="show('home')">Back</button>
</section>

<section id="joinSetup" class="card hidden">
<h2>Join a quiz</h2>
<input id="playerName" placeholder="Your nickname">
<input id="roomPin" placeholder="Room PIN" inputmode="numeric" maxlength="6">
<button onclick="joinRoom()">Join</button>
<button onclick="show('home')">Back</button>
</section>

<section id="lobby" class="card hidden">
<h2>Quiz lobby</h2>
<p>Room PIN:</p>
<h1 id="pinDisplay">------</h1>
<p id="lobbyMessage">Waiting for players…</p>
<ul id="players"></ul>
<div id="hostQuestionTools">
<hr>
<h3>Create a question</h3>
<input id="questionText" placeholder="Write your question">
<input id="opt0" placeholder="Answer A">
<input id="opt1" placeholder="Answer B">
<input id="opt2" placeholder="Answer C">
<input id="opt3" placeholder="Answer D">
<label>Correct answer:</label>
<select id="correct">
<option value="0">A</option><option value="1">B</option>
<option value="2">C</option><option value="3">D</option>
</select>
<br>
<input id="seconds" type="number" min="5" max="90" value="20" placeholder="Seconds">
<button onclick="addQuestion()">Add question</button>
<ol id="questionList"></ol>
<button onclick="startGame()">▶ Start quiz</button>
</div>
</section>

<section id="game" class="card hidden">
<h2 id="roundTitle">Question</h2>
<h3 id="questionDisplay"></h3>
<h2 id="timer"></h2>
<div id="answerButtons"></div>
<p id="answerFeedback"></p>
<button id="nextButton" class="hidden" onclick="nextQuestion()">Next question ➜</button>
</section>

<section id="results" class="card hidden">
<h2>🏆 Leaderboard</h2>
<ol id="leaderboard"></ol>
<button onclick="location.reload()">Back to start</button>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
let peer = null, hostConn = null, connections = {};
let isHost = false, pin = "", myName = "";
let roster = {}, questions = [], scores = {};
let current = -1, answered = false, timerId = null, timeLeft = 0;
let roundAnswers = {}, gameStarted = false;

function show(id) {
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  $(id).classList.remove("hidden");
}
function setStatus(s) { $("status").textContent = s; }
function makePin() { return String(Math.floor(100000 + Math.random()*900000)); }
function safeText(s) { return String(s ?? ""); }

function connectPeer(id, onOpen, onError) {
  peer = new Peer(id, { debug: 0 });
  peer.on("open", onOpen);
  peer.on("error", err => {
    setStatus("Connection error: " + err.type);
    if (onError) onError(err);
  });
  peer.on("disconnected", () => setStatus("Disconnected from PeerJS server. Check internet."));
}

function startHost() {
  myName = $("hostName").value.trim() || "Host";
  isHost = true;
  pin = makePin();
  setStatus("Creating room…");
  connectPeer("quizburst-" + pin, () => {
    roster = {};
    questions = [];
    scores = {};
    current = -1;
    gameStarted = false;
    $("pinDisplay").textContent = pin;
    $("hostQuestionTools").classList.remove("hidden");
    $("lobbyMessage").textContent = "Share the PIN with your players.";
    show("lobby");
    setStatus("Hosting room " + pin);
    peer.on("connection", conn => {
      conn.on("open", () => {
        if (gameStarted) {
          conn.send({type:"error", message:"This quiz has already started."});
          conn.close();
          return;
        }
        const playerId = conn.peer;
        connections[playerId] = conn;
        conn.on("data", msg => handleHostMessage(playerId, msg));
        conn.on("close", () => {
          delete connections[playerId];
          delete roster[playerId];
          updateLobby();
          broadcast({type:"roster", players:Object.values(roster)});
        });
        conn.send({type:"welcome", pin});
      });
    });
  }, () => {});
}

function handleHostMessage(id, msg) {
  if (!msg || typeof msg !== "object") return;
  if (msg.type === "join" && !gameStarted) {
    const name = safeText(msg.name).trim().slice(0,24) || "Player";
    roster[id] = {id, name};
    scores[id] = scores[id] || 0;
    updateLobby();
    broadcast({type:"roster", players:Object.values(roster)});
  }
  if (msg.type === "answer" && gameStarted && msg.round === current &&
      !Object.prototype.hasOwnProperty.call(roundAnswers,id)) {
    const q = questions[current];
    if (!q) return;
    const correct = Number(msg.choice) === q.correct;
    roundAnswers[id] = correct;
    if (correct) scores[id] = (scores[id] || 0) + Math.max(100, timeLeft * 50);
    if (connections[id]) connections[id].send({type:"answerResult", correct});
    if (Object.keys(roundAnswers).length >= Object.keys(roster).length) finishRound();
  }
}

function updateLobby() {
  $("players").innerHTML = "";
  Object.values(roster).forEach(p => {
    const li = document.createElement("li");
    li.textContent = p.name;
    $("players").appendChild(li);
  });
  $("lobbyMessage").textContent =
    Object.keys(roster).length + " player(s) connected";
}

function broadcast(data) {
  Object.values(connections).forEach(c => {
    if (c && c.open) c.send(data);
  });
}

function addQuestion() {
  const text = $("questionText").value.trim();
  const options = [0,1,2,3].map(i => $("opt"+i).value.trim());
  const correct = Number($("correct").value);
  const seconds = Math.max(5, Math.min(90, Number($("seconds").value) || 20));
  if (!text || options.some(o => !o)) {
    alert("Enter the question and all four answers first!");
    return;
  }
  questions.push({text, options, correct, seconds});
  const li = document.createElement("li");
  li.textContent = text;
  $("questionList").appendChild(li);
  $("questionText").value = "";
  [0,1,2,3].forEach(i => $("opt"+i).value = "");
}

function startGame() {
  if (!questions.length) {
    alert("Add at least one question first!");
    return;
  }
  gameStarted = true;
  current = -1;
  broadcast({type:"gameStart", total:questions.length});
  nextQuestion();
}

function nextQuestion() {
  clearInterval(timerId);
  current++;
  if (current >= questions.length) {
    endGame();
    return;
  }
  roundAnswers = {};
  timeLeft = questions[current].seconds;
  const q = questions[current];
  $("roundTitle").textContent = `Question ${current+1} of ${questions.length}`;
  $("questionDisplay").textContent = q.text;
  $("timer").textContent = timeLeft + " seconds";
  $("answerFeedback").textContent = "";
  $("answerButtons").innerHTML = "";
  $("nextButton").classList.add("hidden");
  show("game");
  broadcast({type:"question", index:current, total:questions.length,
    text:q.text, options:q.options, seconds:q.seconds});
  tickTimer();
  timerId = setInterval(tickTimer, 1000);
}

function tickTimer() {
  $("timer").textContent = timeLeft + " seconds";
  if (timeLeft <= 0) {
    finishRound();
  } else {
    timeLeft--;
  }
}

function finishRound() {
  if (!isHost || $("nextButton").dataset.finished === "yes") return;
  clearInterval(timerId);
  $("nextButton").dataset.finished = "yes";
  $("answerButtons").innerHTML = "";
  $("answerFeedback").textContent = "Correct answer: " + questions[current].options[questions[current].correct];
  broadcast({type:"roundEnd", scores, correct:questions[current].correct,
    correctText:questions[current].options[questions[current].correct]});
  $("nextButton").classList.remove("hidden");
  if (Object.keys(roster).length === 0) $("nextButton").classList.remove("hidden");
  updateLeaderboard();
}

function updateLeaderboard() {
  const sorted = Object.values(roster).map(p => ({
    name:p.name, score:scores[p.id] || 0
  })).sort((a,b)=>b.score-a.score);
  $("leaderboard").innerHTML = "";
  sorted.forEach(p => {
    const li = document.createElement("li");
    li.textContent = p.name + " — " + p.score + " points";
    $("leaderboard").appendChild(li);
  });
}

function endGame() {
  clearInterval(timerId);
  broadcast({type:"gameOver", scores, players:roster});
  show("results");
  updateLeaderboard();
  setStatus("Quiz complete!");
}

function joinRoom() {
  myName = $("playerName").value.trim() || "Player";
  pin = $("roomPin").value.trim();
  if (!/^\d{6}$/.test(pin)) {
    alert("Enter the six-digit room PIN.");
    return;
  }
  setStatus("Connecting to host…");
  peer = new Peer();
  peer.on("open", () => {
    hostConn = peer.connect("quizburst-" + pin, {reliable:true});
    hostConn.on("open", () => {
      hostConn.send({type:"join", name:myName});
      $("pinDisplay").textContent = pin;
      $("hostQuestionTools").classList.add("hidden");
      show("lobby");
      $("lobbyMessage").textContent = "Connected! Waiting for the host to start.";
      setStatus("Joined room " + pin);
    });
    hostConn.on("data", handlePlayerMessage);
    hostConn.on("error", () => setStatus("Couldn't reach host. Check the PIN."));
    hostConn.on("close", () => setStatus("Host connection closed."));
  });
  peer.on("error", err => {
    setStatus("Connection error: " + err.type + ". Check the PIN and try again.");
  });
}

function handlePlayerMessage(msg) {
  if (!msg || typeof msg !== "object") return;
  if (msg.type === "welcome") return;
  if (msg.type === "roster") {
    $("players").innerHTML = "";
    (msg.players || []).forEach(p => {
      const li = document.createElement("li");
      li.textContent = p.name;
      $("players").appendChild(li);
    });
  }
  if (msg.type === "gameStart") {
    show("game");
    $("answerFeedback").textContent = "Get ready!";
  }
  if (msg.type === "question") {
    answered = false;
    show("game");
    $("roundTitle").textContent = `Question ${msg.index+1} of ${msg.total}`;
    $("questionDisplay").textContent = msg.text;
    $("timer").textContent = msg.seconds + " seconds";
    $("answerFeedback").textContent = "";
    $("nextButton").classList.add("hidden");
    $("answerButtons").innerHTML = "";
    msg.options.forEach((option, i) => {
      const b = document.createElement("button");
      b.className = "answer";
      b.textContent = String.fromCharCode(65+i) + ": " + option;
      b.onclick = () => {
        if (answered) return;
        answered = true;
        [...$("answerButtons").children].forEach(btn => btn.disabled = true);
        hostConn.send({type:"answer", round:msg.index, choice:i});
        $("answerFeedback").textContent = "Answer submitted!";
      };
      $("answerButtons").appendChild(b);
    });
  }
  if (msg.type === "answerResult") {
    $("answerFeedback").textContent = msg.correct ? "✅ Correct!" : "❌ Not quite!";
  }
  if (msg.type === "roundEnd") {
    $("answerButtons").innerHTML = "";
    $("answerFeedback").textContent = "Correct answer: " + msg.correctText;
  }
  if (msg.type === "gameOver") {
    show("results");
    const players = msg.players || {};
    const scores = msg.scores || {};
    const sorted = Object.values(players).map(p => ({
      name:p.name, score:scores[p.id] || 0
    })).sort((a,b)=>b.score-a.score);
    $("leaderboard").innerHTML = "";
    sorted.forEach(p => {
      const li = document.createElement("li");
      li.textContent = p.name + " — " + p.score + " points";
      $("leaderboard").appendChild(li);
    });
    setStatus("Quiz complete!");
  }
  if (msg.type === "error") {
    alert(msg.message || "Unable to join.");
  }
}
</script>
</body>
</html>
